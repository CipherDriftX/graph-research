<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a1017" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef3f7" />
    <meta
      name="description"
      content="Start research runs, watch them live, and explore the channel graph they build."
    />
    <title>graph-research</title>
    <script>
      // Applied before first paint so a reload never flashes the wrong ground.
      (function () {
        try {
          var stored = localStorage.getItem('graph-research-theme');
          if (stored) document.documentElement.setAttribute('data-theme', stored);
        } catch (e) {
          /* private mode — fall back to the dark default in the markup */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
